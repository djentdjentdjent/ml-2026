[project]
name = "mag-nav"
version = "0.1.0"
description = "Симулятор навигации по вращающемуся магнитному маяку (порт MATLAB-кода)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.1.9"]
anim = ["pillow>=10.0"]
ml = ["catboost>=1.2", "torch>=2.1", "scikit-learn>=1.3", "pandas>=2.0", "joblib>=1.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mag_nav"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
